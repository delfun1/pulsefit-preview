<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co http://127.0.0.1:54321 http://localhost:54321; connect-src 'self' https://cdn.jsdelivr.net https://*.supabase.co wss://*.supabase.co http://127.0.0.1:54321 http://localhost:54321 ws://127.0.0.1:54321; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Users — PulseFit Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" integrity="sha384-nWN3KqaaVcbEsCjLSV+2jMjh62Iny/+mN3srM8TZeM8N6aj7eDl5wwYggjAJ4/sJ" crossorigin="anonymous" rel="stylesheet">
  <link href="../css/admin.css" rel="stylesheet">
</head>
<body>
  <div class="app">
    <aside id="sidebar"></aside>
    <main>
      <header id="topbar"></header>
      <div class="pf-card">
        <form id="filters" class="row g-2 mb-3" role="search">
          <div class="col-md-4"><input id="q" class="form-control" type="search" placeholder="Search name, email or phone" aria-label="Search users"></div>
          <div class="col-6 col-md-2">
            <select id="role" class="form-select" aria-label="Filter by role">
              <option value="">All roles</option><option value="client">Clients</option><option value="coach">Coaches</option>
              <option value="store_manager">Store managers</option><option value="admin">Administrators</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <select id="status" class="form-select" aria-label="Filter by account status">
              <option value="">Any status</option><option value="active">Active</option><option value="suspended">Suspended</option><option value="deleted">Deleted</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <select id="plan" class="form-select" aria-label="Filter by plan">
              <option value="">Any plan</option><option value="paid">Paying members</option><option value="free">Free accounts</option>
            </select>
          </div>
          <div class="col-6 col-md-2 d-flex gap-2">
            <button class="btn btn-primary flex-grow-1" type="submit"><i class="bi bi-search"></i> Search</button>
            <button class="btn btn-outline-secondary" type="button" id="export" title="Export the matching users as CSV" aria-label="Export CSV"><i class="bi bi-download"></i></button>
          </div>
        </form>
        <div id="error" class="alert alert-danger d-none" role="alert"></div>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead><tr><th>Name</th><th>Email</th><th>Roles</th><th>Plan</th><th>Status</th><th>Joined</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <nav class="d-flex justify-content-between align-items-center" aria-label="Pagination">
          <span class="text-secondary small" id="count"></span>
          <div class="btn-group"><button class="btn btn-outline-secondary btn-sm" id="prev">Previous</button><button class="btn btn-outline-secondary btn-sm" id="next">Next</button></div>
        </nav>
      </div>
    </main>
  </div>
  <div class="offcanvas offcanvas-end" tabindex="-1" id="detail" aria-labelledby="detail-title" style="--bs-offcanvas-width: min(640px, 100vw)">
    <div class="offcanvas-header">
      <h2 class="offcanvas-title h5" id="detail-title">Member</h2>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body" id="detail-body"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script type="module" src="../js/pages/users.js"></script>
</body>
</html>
