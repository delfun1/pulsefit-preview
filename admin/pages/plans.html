<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co http://127.0.0.1:54321 http://localhost:54321; connect-src 'self' https://cdn.jsdelivr.net https://*.supabase.co wss://*.supabase.co http://127.0.0.1:54321 http://localhost:54321 ws://127.0.0.1:54321; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Subscription plans — PulseFit Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" integrity="sha384-nWN3KqaaVcbEsCjLSV+2jMjh62Iny/+mN3srM8TZeM8N6aj7eDl5wwYggjAJ4/sJ" crossorigin="anonymous" rel="stylesheet">
  <link href="../css/admin.css" rel="stylesheet">
</head>
<body>
  <div class="app">
    <aside id="sidebar"></aside>
    <main>
      <header id="topbar"></header>
      <div class="d-flex mb-3"><p class="text-secondary small mb-0">Prices are examples until you change them. Changing a price affects new payments only — past payments keep their original amount.</p>
        <button class="btn btn-accent ms-auto" id="new-plan"><i class="bi bi-plus-lg"></i> New plan</button></div>
      <div id="error" class="alert alert-danger d-none" role="alert"></div>
      <div class="row g-3" id="list"></div>

      <div class="modal fade" id="plan-modal" tabindex="-1" aria-labelledby="plan-title" aria-hidden="true">
        <div class="modal-dialog modal-lg"><form class="modal-content" id="plan-form" novalidate>
          <div class="modal-header"><h2 class="modal-title h5" id="plan-title">Plan</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
          <div class="modal-body row g-3">
            <div class="col-md-6"><label class="form-label" for="f-name">Name</label><input class="form-control" id="f-name" required maxlength="80"></div>
            <div class="col-md-6"><label class="form-label" for="f-code">Code (letters, numbers, _)</label><input class="form-control" id="f-code" required pattern="[a-z0-9_]+" maxlength="60"></div>
            <div class="col-12"><label class="form-label" for="f-description">Short description</label><input class="form-control" id="f-description" maxlength="200"></div>
            <div class="col-md-4"><label class="form-label" for="f-price">Price</label><input class="form-control" id="f-price" type="number" min="0" step="any" required></div>
            <div class="col-md-4"><label class="form-label" for="f-currency">Currency</label><select class="form-select" id="f-currency"></select></div>
            <div class="col-md-4"><label class="form-label" for="f-interval">Billing</label>
              <select class="form-select" id="f-interval"><option value="month">Monthly</option><option value="year">Yearly</option><option value="one_time">One-time (no expiry)</option></select></div>
            <div class="col-md-3"><label class="form-label" for="f-trial">Free trial days</label><input class="form-control" id="f-trial" type="number" min="0" max="90" value="0"></div>
            <div class="col-md-3"><label class="form-label" for="f-grace">Grace days</label><input class="form-control" id="f-grace" type="number" min="0" max="30" value="3"></div>
            <div class="col-md-3"><label class="form-label" for="f-level">Access level</label><input class="form-control" id="f-level" type="number" min="0" max="10" value="1">
              <div class="form-text">Videos with a higher level stay locked.</div></div>
            <div class="col-md-3"><label class="form-label" for="f-ai">AI messages/day</label><input class="form-control" id="f-ai" type="number" min="0" value="5"></div>
            <div class="col-md-4"><label class="form-label" for="f-discount">Member discount %</label><input class="form-control" id="f-discount" type="number" min="0" max="100" step="0.5" value="0"></div>
            <div class="col-md-4"><label class="form-label" for="f-order">Display order</label><input class="form-control" id="f-order" type="number" value="0"></div>
            <div class="col-md-4 d-flex flex-column justify-content-end gap-1">
              <div class="form-check"><input class="form-check-input" type="checkbox" id="f-priority"><label class="form-check-label" for="f-priority">Priority booking</label></div>
              <div class="form-check"><input class="form-check-input" type="checkbox" id="f-active" checked><label class="form-check-label" for="f-active">Available for purchase</label></div>
            </div>
            <div class="col-12"><label class="form-label" for="f-features">Benefits shown to customers (one per line)</label><textarea class="form-control" id="f-features" rows="4"></textarea></div>
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary">Save plan</button></div>
        </form></div>
      </div>    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script type="module" src="../js/pages/plans.js"></script>
</body>
</html>
