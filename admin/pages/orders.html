<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co http://127.0.0.1:54321 http://localhost:54321; connect-src 'self' https://cdn.jsdelivr.net https://*.supabase.co wss://*.supabase.co http://127.0.0.1:54321 http://localhost:54321 ws://127.0.0.1:54321; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Orders — PulseFit Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" integrity="sha384-nWN3KqaaVcbEsCjLSV+2jMjh62Iny/+mN3srM8TZeM8N6aj7eDl5wwYggjAJ4/sJ" crossorigin="anonymous" rel="stylesheet">
  <link href="../css/admin.css" rel="stylesheet">
</head>
<body>
  <div class="app">
    <aside id="sidebar"></aside>
    <main>
      <header id="topbar"></header>
      <div class="pf-card">
        <form id="filters" class="row g-2 mb-3" role="search">
          <div class="col-md-4"><input id="q" class="form-control" type="search" placeholder="Order number (ORD-…)" aria-label="Order number"></div>
          <div class="col-md-3"><select id="status" class="form-select" aria-label="Status">
            <option value="">All statuses</option><option value="paid">Paid — to prepare</option><option value="processing">Processing</option><option value="shipped">Shipped</option>
            <option value="delivered">Delivered</option><option value="pending_payment">Awaiting payment</option><option value="cancelled">Cancelled</option><option value="refunded">Refunded</option></select></div>
          <div class="col-md-2 d-grid"><button class="btn btn-primary" type="submit">Filter</button></div>
                  <div class="col-auto ms-auto"><button class="btn btn-outline-secondary" type="button" id="export" title="Export the matching rows as CSV"><i class="bi bi-download"></i> Export CSV</button></div>
        </form>
        <div id="error" class="alert alert-danger d-none" role="alert"></div>
        <div class="table-responsive"><table class="table align-middle">
          <thead><tr><th>Order</th><th>Date</th><th>Customer</th><th class="text-end">Total</th><th>Payment</th><th>Status</th><th></th></tr></thead>
          <tbody id="rows"></tbody></table></div>
        <nav class="d-flex justify-content-between align-items-center"><span class="small text-secondary" id="count"></span>
          <div class="btn-group"><button class="btn btn-outline-secondary btn-sm" id="prev">Previous</button><button class="btn btn-outline-secondary btn-sm" id="next">Next</button></div></nav>
      </div>
      <div class="offcanvas offcanvas-end" tabindex="-1" id="detail" aria-labelledby="detail-title" style="width:min(520px,100vw)">
        <div class="offcanvas-header"><h2 class="offcanvas-title h5" id="detail-title">Order</h2><button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button></div>
        <div class="offcanvas-body" id="detail-body"></div>
      </div>    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script type="module" src="../js/pages/orders.js"></script>
</body>
</html>
