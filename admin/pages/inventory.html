<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co http://127.0.0.1:54321 http://localhost:54321; connect-src 'self' https://cdn.jsdelivr.net https://*.supabase.co wss://*.supabase.co http://127.0.0.1:54321 http://localhost:54321 ws://127.0.0.1:54321; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Inventory — PulseFit Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" integrity="sha384-nWN3KqaaVcbEsCjLSV+2jMjh62Iny/+mN3srM8TZeM8N6aj7eDl5wwYggjAJ4/sJ" crossorigin="anonymous" rel="stylesheet">
  <link href="../css/admin.css" rel="stylesheet">
</head>
<body>
  <div class="app">
    <aside id="sidebar"></aside>
    <main>
      <header id="topbar"></header>
      <div class="row g-3">
        <div class="col-lg-7">
          <div class="pf-card">
            <form id="filters" class="d-flex gap-2 mb-3" role="search">
              <input id="q" class="form-control" type="search" placeholder="Search product or SKU" aria-label="Search">
              <div class="form-check form-switch text-nowrap align-self-center"><input class="form-check-input" type="checkbox" id="low"><label class="form-check-label" for="low">Low stock only</label></div>
              <button class="btn btn-primary" type="submit">Search</button>
            </form>
            <div id="error" class="alert alert-danger d-none" role="alert"></div>
            <div class="table-responsive"><table class="table align-middle">
              <thead><tr><th>Product</th><th>SKU</th><th class="text-end">Stock</th><th class="text-end">Alert at</th><th></th></tr></thead>
              <tbody id="rows"></tbody></table></div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="pf-card">
            <h2 class="h6 fw-bold" id="hist-title">Stock history</h2>
            <p class="small text-secondary" id="hist-hint">Select a variant to see every stock change (orders, restocks, returns, adjustments).</p>
            <ul class="list-group list-group-flush small" id="history"></ul>
          </div>
        </div>
      </div>
      <div class="modal fade" id="adjust-modal" tabindex="-1" aria-labelledby="adjust-title" aria-hidden="true">
        <div class="modal-dialog"><form class="modal-content" id="adjust-form">
          <div class="modal-header"><h2 class="modal-title h5" id="adjust-title">Adjust stock</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
          <div class="modal-body">
            <p class="small" id="adjust-info"></p>
            <label class="form-label" for="adj-change">Change (+ to add, − to remove)</label>
            <input class="form-control mb-3" id="adj-change" type="number" step="1" required>
            <label class="form-label" for="adj-reason">Reason</label>
            <select class="form-select mb-3" id="adj-reason"><option value="restock">Restock (delivery received)</option><option value="return">Customer return</option><option value="damaged">Damaged / lost</option><option value="adjustment">Stock count correction</option></select>
            <label class="form-label" for="adj-note">Note</label><input class="form-control" id="adj-note" maxlength="200">
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary">Save</button></div>
        </form></div>
      </div>    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script type="module" src="../js/pages/inventory.js"></script>
</body>
</html>
