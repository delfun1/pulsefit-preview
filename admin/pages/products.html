<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co http://127.0.0.1:54321 http://localhost:54321; connect-src 'self' https://cdn.jsdelivr.net https://*.supabase.co wss://*.supabase.co http://127.0.0.1:54321 http://localhost:54321 ws://127.0.0.1:54321; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Products — PulseFit Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" integrity="sha384-nWN3KqaaVcbEsCjLSV+2jMjh62Iny/+mN3srM8TZeM8N6aj7eDl5wwYggjAJ4/sJ" crossorigin="anonymous" rel="stylesheet">
  <link href="../css/admin.css" rel="stylesheet">
</head>
<body>
  <div class="app">
    <aside id="sidebar"></aside>
    <main>
      <header id="topbar"></header>
      <div class="pf-card">
        <form id="filters" class="row g-2 mb-3" role="search">
          <div class="col-md-4"><input id="q" class="form-control" type="search" placeholder="Search name, brand, SKU" aria-label="Search products"></div>
          <div class="col-md-3"><select id="category" class="form-select" aria-label="Category"><option value="">All categories</option></select></div>
          <div class="col-md-2"><select id="status" class="form-select" aria-label="Status"><option value="">Any status</option><option>active</option><option>draft</option><option>archived</option></select></div>
          <div class="col-md-1 d-grid"><button class="btn btn-primary" type="submit" aria-label="Search"><i class="bi bi-search"></i></button></div>
          <div class="col-md-2 d-grid"><a class="btn btn-accent" href="product-edit.html"><i class="bi bi-plus-lg"></i> New product</a></div>
        </form>
        <div id="error" class="alert alert-danger d-none" role="alert"></div>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead><tr><th></th><th>Product</th><th>Category</th><th class="text-end">Price</th><th class="text-end">Stock</th><th>Status</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <nav class="d-flex justify-content-between align-items-center"><span class="small text-secondary" id="count"></span>
          <div class="btn-group"><button class="btn btn-outline-secondary btn-sm" id="prev">Previous</button><button class="btn btn-outline-secondary btn-sm" id="next">Next</button></div></nav>
      </div>    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script type="module" src="../js/pages/products.js"></script>
</body>
</html>
