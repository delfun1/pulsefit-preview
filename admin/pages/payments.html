<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co http://127.0.0.1:54321 http://localhost:54321; connect-src 'self' https://cdn.jsdelivr.net https://*.supabase.co wss://*.supabase.co http://127.0.0.1:54321 http://localhost:54321 ws://127.0.0.1:54321; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Payments — PulseFit Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" integrity="sha384-nWN3KqaaVcbEsCjLSV+2jMjh62Iny/+mN3srM8TZeM8N6aj7eDl5wwYggjAJ4/sJ" crossorigin="anonymous" rel="stylesheet">
  <link href="../css/admin.css" rel="stylesheet">
</head>
<body>
  <div class="app">
    <aside id="sidebar"></aside>
    <main>
      <header id="topbar"></header>
      <div class="pf-card">
        <form id="filters" class="row g-2 mb-3">
          <div class="col-md-4"><input id="q" class="form-control" type="search" placeholder="Reference (PF-…)" aria-label="Search reference"></div>
          <div class="col-md-3">
            <select id="status" class="form-select" aria-label="Status">
              <option value="">All statuses</option><option>succeeded</option><option>pending</option><option>failed</option>
              <option>disputed</option><option>refunded</option><option>partially_refunded</option><option>cancelled</option>
            </select>
          </div>
          <div class="col-md-3">
            <select id="purpose" class="form-select" aria-label="Purpose">
              <option value="">All purposes</option><option value="subscription">Subscriptions</option><option value="order">Orders</option><option value="appointment">Coaching sessions</option>
            </select>
          </div>
          <div class="col-md-2 d-grid"><button class="btn btn-primary" type="submit">Filter</button></div>
                  <div class="col-auto ms-auto"><button class="btn btn-outline-secondary" type="button" id="export" title="Export the matching rows as CSV"><i class="bi bi-download"></i> Export CSV</button></div>
        </form>
        <p class="small text-secondary">Only <strong>succeeded</strong> payments count as revenue. <strong>Disputed</strong> means the amount or currency did not match — check it in the Flutterwave dashboard.</p>
        <div id="error" class="alert alert-danger d-none" role="alert"></div>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead><tr><th>Date</th><th>Reference</th><th>Customer</th><th>For</th><th class="text-end">Amount</th><th>Method</th><th>Status</th><th class="text-end"></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <nav class="d-flex justify-content-between align-items-center"><span class="small text-secondary" id="count"></span>
          <div class="btn-group"><button class="btn btn-outline-secondary btn-sm" id="prev">Previous</button><button class="btn btn-outline-secondary btn-sm" id="next">Next</button></div></nav>
      </div>

      <div class="modal fade" id="refund-modal" tabindex="-1" aria-labelledby="refund-title" aria-hidden="true">
        <div class="modal-dialog"><form class="modal-content" id="refund-form">
          <div class="modal-header"><h2 class="modal-title h5" id="refund-title">Refund payment</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
          <div class="modal-body">
            <p id="refund-info" class="small"></p>
            <label class="form-label" for="refund-amount">Amount to refund (<span id="refund-cur"></span>)</label>
            <input class="form-control mb-3" id="refund-amount" type="number" min="1" step="1" required>
            <label class="form-label" for="refund-reason">Reason (shown in the audit log)</label>
            <input class="form-control" id="refund-reason" required minlength="3" maxlength="500">
            <div class="alert alert-warning small mt-3 mb-0">The refund is sent to Flutterwave immediately and cannot be undone here.</div>
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-danger" id="refund-submit">Refund</button></div>
        </form></div>
      </div>    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script type="module" src="../js/pages/payments.js"></script>
</body>
</html>
